<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商草稿生成器 - 演示页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .demo-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            width: 90%;
            backdrop-filter: blur(10px);
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #18a058 0%, #36ad6a 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 8px 32px rgba(24, 160, 88, 0.4);
            animation: logoFloat 3s ease-in-out infinite;
        }

        .logo::before {
            content: "✨";
            font-size: 40px;
            color: white;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #18a058 0%, #36ad6a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .feature {
            background: rgba(248, 249, 250, 0.8);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .feature:hover {
            transform: translateY(-5px);
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .feature-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .feature-desc {
            font-size: 14px;
            color: #7f8c8d;
        }

        .status {
            background: rgba(24, 160, 88, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .status-title {
            font-size: 18px;
            font-weight: 600;
            color: #18a058;
            margin-bottom: 12px;
        }

        .status-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background: #18a058;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .api-link {
            display: inline-block;
            background: linear-gradient(135deg, #18a058 0%, #36ad6a 100%);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(24, 160, 88, 0.3);
        }

        .api-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(24, 160, 88, 0.4);
        }

        .tech-stack {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        .tech-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #2c3e50;
        }

        .tech-items {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .tech-item {
            background: rgba(255, 255, 255, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: #5a6c7d;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        @media (max-width: 768px) {
            .demo-container {
                padding: 30px 20px;
                margin: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .subtitle {
                font-size: 16px;
            }
            
            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="logo"></div>
        <h1>AI 商品草稿生成器</h1>
        <p class="subtitle">智能生成 · 高效创作 · 一键完成</p>
        
        <div class="status">
            <div class="status-title">🎉 项目已成功启动！</div>
            <div class="status-item">
                <span>后端服务状态</span>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div class="status-indicator"></div>
                    <span style="color: #18a058; font-weight: 600;">运行中</span>
                </div>
            </div>
            <div class="status-item">
                <span>API 文档</span>
                <span style="color: #18a058; font-weight: 600;">可用</span>
            </div>
        </div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">📊</div>
                <div class="feature-title">Excel 批量导入</div>
                <div class="feature-desc">支持 xlsx 文件批量导入商品信息</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🖼️</div>
                <div class="feature-title">图片智能处理</div>
                <div class="feature-desc">自动压缩优化，生成精美主图</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🤖</div>
                <div class="feature-title">AI 内容生成</div>
                <div class="feature-desc">智能生成标题和卖点文案</div>
            </div>
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-title">极速处理</div>
                <div class="feature-desc">3秒内看到首条结果</div>
            </div>
        </div>

        <a href="http://localhost:8000/docs" class="api-link" target="_blank">
            📖 查看 API 文档
        </a>

        <div class="tech-stack">
            <div class="tech-title">技术栈</div>
            <div class="tech-items">
                <div class="tech-item">Vue 3</div>
                <div class="tech-item">Naive UI</div>
                <div class="tech-item">FastAPI</div>
                <div class="tech-item">OpenAI</div>
                <div class="tech-item">Cloudinary</div>
                <div class="tech-item">SQLite</div>
            </div>
        </div>
    </div>

    <script>
        // 检查后端服务状态
        fetch('http://localhost:8000/health')
            .then(response => response.json())
            .then(data => {
                console.log('后端服务状态:', data);
            })
            .catch(error => {
                console.error('无法连接后端服务:', error);
                document.querySelector('.status-indicator').style.background = '#e74c3c';
                document.querySelector('.status-item span:last-child').textContent = '未连接';
                document.querySelector('.status-item span:last-child').style.color = '#e74c3c';
            });
    </script>
</body>
</html>
